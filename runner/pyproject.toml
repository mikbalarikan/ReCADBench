[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recadbench-run"
version = "0.0.0"
description = "ReCADBench runner: compose, gate hook, agent backends, finish"
requires-python = ">=3.11"
dependencies = ["recadbench-spec"]  # P1 stub: real dependencies added by the implementing prompt

[tool.setuptools.packages.find]
include = ["recadbench_run*"]
