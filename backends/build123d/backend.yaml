# L1 pin: build123d backend (reference backend). Upstream build123d and pzfreo/build123d-mcp are
# used unmodified. Agent path: Claude <-stdio-> build123d-mcp (persistent build123d session).
# Install: install.md (desktop/CI pip route below; Termux route stays build123d 0.10.0).
id: build123d
software:
  name: build123d-mcp
  version: 0.3.91
  source: pypi:build123d-mcp==0.3.91 (pzfreo/build123d-mcp, Apache-2.0); kernel build123d==0.13.0 (OCP 8)
interface:
  kind: mcp
  mcp:
    command: build123d-mcp
    args: []
  # NOTE for P10 (gate_hook / runner): `all` also covers build123d-mcp 0.3.91's read-only
  # mesh / RE-analysis tools; they are listed in denied_tools below (ADR 0004).
  # `load_part` is only served with --library (hidden otherwise); kept for that case.
  cad_prefixes:
    all:
    - mcp__build123d__
    # tools of build123d-mcp 0.3.91 that change the session's model state (tool annotations
    # read_only_hint=False, excluding export/bank_candidate/save_snapshot/resolve/
    # save_drawing_annotations/install_skill, which write files or labels but not the model)
    mutating:
    - mcp__build123d__execute
    - mcp__build123d__execute_file
    - mcp__build123d__load_part
    - mcp__build123d__import_cad_file
    - mcp__build123d__edit_feature
    - mcp__build123d__restore_snapshot
    - mcp__build123d__reset
    - mcp__build123d__destroy_session
hosts:
- linux
- windows
- macos
- termux
adapter_cli:
  export: recad build123d export
  extract: recad build123d extract
  set_param: recad build123d set-param
  replay: recad build123d replay
  execute_ir: recad build123d execute-ir
# ADR 0004: tools gate_hook denies because they import or analyse the scan inside the CAD session
# (RE analysis goes through retk, identical for every backend). `tool` = tool-name prefix;
# with args_regex only calls whose JSON arguments match are denied. Checked against
# build123d-mcp 0.3.91 tools/list. Not covered: an execute_file script that imports the scan
# (only its path is visible) -- extract still reports imported geometry as unmapped.
denied_tools:
- tool: mcp__build123d__import_cad_file
  reason: imports a STEP/STL/3MF file (the scan) into the session
- tool: mcp__build123d__mesh_
  reason: mesh_section / mesh_holes analyse a mesh (the scan)
- tool: mcp__build123d__find_
  reason: find_holes / find_hole_patterns / find_bosses / find_bored_bosses / find_countersinks / find_candidates recognise features (RE analysis)
- tool: mcp__build123d__recognise_features
  reason: feature recognition (RE analysis)
- tool: mcp__build123d__interface_features
  reason: mounting-face recognition from recognised holes (RE analysis)
- tool: mcp__build123d__compare
  reason: compares shapes / files, e.g. the model against the scan (self-checks use retk self_deviation)
- tool: mcp__build123d__execute
  args_regex: '(?i)\b(import_stl|import_threemf|Mesher)\b|\.(stl|ply|obj|3mf)\b'
  reason: code that loads a mesh (the scan) into the session
- tool: mcp__build123d__execute_file
  args_regex: '(?i)\.(stl|ply|obj|3mf)\b'
  reason: executes a mesh file path
max_parallel: 2
# Results: backends/conformance/CONFORMANCE.md (run_conformance.py through recad 0.1.0, all 3 backends).
conformance:
  passed: 10
  total: 10
  date: '2026-11-06'
  software_version: build123d 0.13.0 (OCP 8) + build123d-mcp 0.3.91, Python 3.13 (Linux x86_64)
