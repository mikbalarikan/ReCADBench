# L1 pin: SolidCraft backend. Upstream tangency-labs/solidcraft is used unmodified.
# Agent path: Claude <-stdio-> `solidcraft-cli mcp --headless` (an in-process design session, no
# window). `--headless` is passed explicitly: plain `solidcraft-cli mcp` attaches to a running
# desktop app when one exists, which would break run isolation and max_parallel. The runner adds
# `--allow-path <run_dir>/cad` so the agent can save/export inside its run dir (docs/mcp.md).
# Install: install.md (built from source with cargo at tag v0.30.1; release installers also ship
# solidcraft-cli). Termux ARM64: unverified, see install.md "Termux test" (not listed in hosts).
id: solidcraft
software:
  name: solidcraft-cli
  version: 0.30.1
  source: git:https://github.com/tangency-labs/solidcraft@v0.30.1 (commit 8e2b0cd60d14b4152b12b8f1fdb2bcfdcd8c52f4), built from source with `cargo build --release -p solidcraft-cli` (rust >= 1.95)
interface:
  kind: mcp
  mcp:
    command: solidcraft-cli
    args:
    - mcp
    - --headless
  cad_prefixes:
    all:
    - mcp__solidcraft__
    # tools of solidcraft-cli 0.30.1 `mcp` (tools/list) that change the design: annotations
    # readOnlyHint=false, excluding export/save/screenshot/compare_picture (write files only) and
    # check_parameters (sets values, then restores the checkpoint).
    mutating:
    - mcp__solidcraft__execute
    - mcp__solidcraft__batch
    - mcp__solidcraft__set_parameter
    - mcp__solidcraft__undo
    - mcp__solidcraft__redo
    - mcp__solidcraft__new_design
    - mcp__solidcraft__open
hosts:
- linux
- windows
- macos
adapter_cli:
  export: recad solidcraft export
  extract: recad solidcraft extract
  set_param: recad solidcraft set-param
  replay: recad solidcraft replay
# ADR 0004: commands gate_hook denies because they import or analyse the scan inside SolidCraft
# (RE analysis goes through retk). Scan import is a command inside an execute/batch script, so
# the entries match the JSON arguments (args_regex); the adapter's extract also reports these
# commands as unmapped (IMPORT_COMMANDS / IMPORT_PREFIXES).
denied_tools:
- tool: mcp__solidcraft__execute
  args_regex: '(file\.insert_mesh|pointcloud\.|sketch\.fit_curves_to_section)'
  reason: inserts a mesh / point cloud (the scan) or fits sketch curves to a mesh section
- tool: mcp__solidcraft__batch
  args_regex: '(file\.insert_mesh|pointcloud\.|sketch\.fit_curves_to_section)'
  reason: inserts a mesh / point cloud (the scan) or fits sketch curves to a mesh section
- tool: mcp__solidcraft__open
  args_regex: '(?i)\.(stl|ply|obj|3mf)\b'
  reason: opens a mesh file (the scan)
max_parallel: 2
# Results: backends/conformance/CONFORMANCE.md (run_conformance.py through recad 0.1.0, all 3 backends).
conformance:
  passed: 10
  total: 10
  date: '2026-11-06'
  software_version: solidcraft-cli 0.30.1 (source build, rustc 1.97.0, Linux x86_64)
