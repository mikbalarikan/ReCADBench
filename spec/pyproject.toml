[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recadbench-spec"
version = "0.0.0"
description = "ReCADBench contracts: JSON Schemas, feature taxonomy, models, validate CLI"
requires-python = ">=3.11"
dependencies = []  # P1 stub: real dependencies added by the implementing prompt

[tool.setuptools.packages.find]
include = ["recadbench_spec*"]

[tool.setuptools.package-data]
