[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recadbench-spec"
version = "0.1.0"
description = "ReCADBench contracts: JSON Schemas, feature taxonomy, pydantic models, validate CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "jsonschema>=4.21,<5",
  "pyyaml>=6",
]

[project.scripts]
recadbench-spec = "recadbench_spec.cli:main"

[tool.setuptools.packages.find]
include = ["recadbench_spec*"]

[tool.setuptools.package-data]
recadbench_spec = ["schemas/*.json", "feature_taxonomy.yaml"]
