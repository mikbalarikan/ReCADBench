name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # one resolver run: the runner depends on the local backends package (recad, nx-run),
          # the orchestrator on the runner. L1 dispatcher + the build123d reference backend
          # (cadquery-ocp-novtk wheels) + build123d-mcp for the runner's end-to-end replay test.
          # FreeCAD / SolidCraft are not installed: their adapter tests are not in testpaths.
          pip install ruff pytest -e ./spec -e ./evaluator -e ./backends -e ./runner \
            -e ./orchestrator -r dataset/requirements.txt build123d==0.13.0 build123d-mcp==0.3.91
      - name: Public-repo data guard
        run: python dataset/tools/check_public.py
      - name: Ruff
        run: ruff check .
      - name: Pytest
        # runner/orchestrator: synthetic only; host-only tests skip without RECADBENCH_GT_DIR
        run: pytest
