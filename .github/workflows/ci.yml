name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -e ./spec -e ./evaluator -e ./runner -r dataset/requirements.txt
          # L1 dispatcher (`recad`) + the build123d reference backend (cadquery-ocp-novtk wheels).
          # FreeCAD / SolidCraft are not installed: their adapter tests are not in testpaths.
          pip install -e ./backends build123d==0.13.0
      - name: Public-repo data guard
        run: python dataset/tools/check_public.py
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest
